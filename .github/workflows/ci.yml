name: VEIL CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Build, and Automated Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify TypeScript Types
        run: pnpm run typecheck

      - name: Build All Workspaces
        run: pnpm run build

      - name: Generate throwaway test secrets
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV
          echo "ERP_GATE_API_KEY=$(openssl rand -hex 24)" >> $GITHUB_ENV

      - name: Start VEIL API Server Daemon for Testing
        env:
          PORT: 3001
        run: |
          pnpm --filter @workspace/api-server run start &
          sleep 4

      - name: Run Automated Test Suite
        env:
          TEST_API_URL: http://localhost:3001
        run: pnpm test
